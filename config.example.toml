# 설정 파일 예시. config.toml 로 복사해 값을 채운다(config.toml 은 git 에 올라가지 않는다).
#   cp config.example.toml config.toml && chmod 600 config.toml
# 다른 위치의 파일은 환경변수 RND_CONFIG 또는 --config 로 준다.

[llm]
# OpenAI 호환 주소(…/v1)와 모델 이름. 도구 호출(tool_calls)을 지원하는 모델이어야 한다.
base_url = "http://127.0.0.1:8000/v1"
model = "hai"
api_key = ""            # 필요 없으면 비워 둔다
temperature = 0.3
max_tokens = 16000      # 답 하나의 최대 길이(문서를 만들 때는 내용 전체가 여기에 들어가야 한다)
# thinking = true        # 생각하는 모델(Qwen 등)에서 답하기 전에 속으로 따져 보게 한다(검색어 넓히기·다시 찾기 판단이 좋아진다).
#                        # false 면 끈다. 적지 않으면 모델 기본을 따른다. 켰을 때 어느 단계까지 쓸지는 [agent] thinking_steps.
timeout = 300           # 초

[agent]
max_steps = 24              # 질문 하나에 도구를 부르는 최대 횟수(왕복 수)
tool_result_chars = 100000  # 도구 결과 하나를 모델에 넘길 때의 최대 글자 수(검색 결과 100건이 들어가는 크기)
turn_result_chars = 300000  # 질문 하나에서 넘기는 도구 결과의 합. 모델 문맥 길이에 맞춘다(한글 자료는 1토큰이 1.3~1.5자쯤)
sweep_max_items = 5000      # 전체 확인(review_all)이 한 번에 넘겨 보는 자료 수의 상한
sweep_seconds = 600         # 전체 확인 한 번에 쓰는 시간의 상한(초)
max_images = 4              # 도구가 돌려준 그림을 한 번에 몇 장까지 모델에 보일지
thinking_steps = 1          # [llm] thinking = true 일 때, 질문마다 앞의 몇 단계까지 속생각을 쓸지(0 = 모든 단계).
                            # 검색 결과를 받은 뒤에도 켜 두면 답 하나에 몇 분이 걸릴 수 있다(실측 5분)
thinking_tokens = 4000      # 속생각을 쓰는 단계의 길이 상한(속생각 + 답). 넘으면 생각 없이 다시 묻는다

# 붙일 MCP 서버들. 이름은 로그와 안내문에 쓰인다.
[[mcp]]
name = "bizinfo"
url = "http://127.0.0.1:8765/mcp"

[[mcp]]
name = "linkreader"
url = "http://127.0.0.1:8766/mcp"

[[mcp]]
name = "history"
url = "http://127.0.0.1:8767/mcp"

[[mcp]]
name = "ntis"
url = "http://127.0.0.1:8768/mcp"

[web]
host = "127.0.0.1"          # 밖에서 직접 붙지 못하게 이 장비 안에서만 연다(외부 공개는 터널을 거친다)
port = 8080
session_hours = 12          # 이만큼 쓰지 않으면 다시 로그인
max_concurrent = 2          # 동시에 처리하는 질문 수
max_question_chars = 4000
trust_forwarded = false     # Cloudflare 터널 뒤에 둘 때만 true (접속 IP 를 CF-Connecting-IP 에서 읽는다)
allowed_hosts = ["127.0.0.1", "localhost"]   # 이 이름으로 온 요청만 받는다. 외부 공개 시 공개 도메인을 더한다

# https 로 열기. 내부망에 직접 열 때(host = "0.0.0.0")는 켜는 것을 권한다. 인증서는  python -m chat.tlscert  로 만든다.
# 상대 경로는 이 파일이 있는 폴더 기준이다. Cloudflare 터널 뒤에서는 터널이 https 를 맡으므로 없어도 된다.
# tls_cert = "certs/cert.pem"
# tls_key = "certs/key.pem"

# 로그인 계정. 계정이 하나도 없으면 웹 서버는 뜨지 않는다.
# 비밀번호 해시는  python -m chat.passwd  로 만들어 붙여 넣는다.
# [[users]]
# name = "이름"
# password_hash = "scrypt$..."

# 첨부한 한글 문서(HWP·HWPX)를 고치는 엔진 rhwp(https://github.com/edwardkim/rhwp)의 실행 파일.
# 비워 두면 PATH 에서 rhwp 를 찾고, 없으면 한글 문서는 읽기만 된다(워드 문서는 엔진 없이 고친다).
# [documents]
# rhwp = "/opt/rhwp/rhwp"

# 메일 보내기(아침 브리핑용). 보내는 전용 계정과 그 계정의 앱 비밀번호를 적는다. username 이 비어 있으면 메일은 보내지 않는다.
# [mail]
# host = "smtp.gmail.com"
# port = 587
# username = ""
# password = ""
# sender_name = "R&D 검색"

# 아침 브리핑: 계정마다 대화 기록(최근 history_days 일)에서 관심사를 뽑아, 정해진 시각에 그 주제의 새 소식을 찾아 정리한다.
# 브리핑은 그 계정의 대화 하나로 남고, [[users]] 항목에 email = "…" 이 있으면 메일로도 보낸다(email 없이 brief = true 면 화면으로만).
# 첫 브리핑은 올해와 지난해를 돌아보는 요약(마감 포함)이고, 그다음부터는 지난 브리핑 이후 새로 올라온 것과 마감이 가까운 것이다.
# [briefing]
# enabled = true
# time = "10:00"              # 만들기 시작하는 시각(서버 시간). 서버가 늦게 뜬 날은 until 전이면 그때 만든다
# until = "18:00"
# app_url = ""                # 메일의 "이어서 묻기"가 갈 주소
# refresh_status = ""         # 아침 자료 갱신의 결과 파일(ops.refresh 의 data/refresh.json). 주면 갱신이 끝나기를 wait_minutes 분까지 기다린다
# wait_minutes = 30
# history_days = 30
# max_interests = 5
# first_years = []            # 첫 브리핑에서 돌아볼 연도(비우면 지난해와 올해)
