# 설정 파일 예시. config.toml 로 복사해 값을 채운다(config.toml 은 git 에 올라가지 않는다).
#   cp config.example.toml config.toml && chmod 600 config.toml
# 다른 위치의 파일은 환경변수 RND_CONFIG 또는 --config 로 준다.

[llm]
# OpenAI 호환 주소(…/v1)와 모델 이름. 도구 호출(tool_calls)을 지원하는 모델이어야 한다.
base_url = "http://127.0.0.1:8000/v1"
model = "hai"
api_key = ""            # 필요 없으면 비워 둔다
temperature = 0.3
max_tokens = 16000      # 답 하나의 최대 길이(문서를 만들 때는 내용 전체가 여기에 들어가야 한다)
# thinking = false       # 생각하는 모델(Qwen 등)에서 답하기 전의 속생각을 끈다. 빨라지지만 복잡한 질문의 품질이 떨어질 수 있다.
#                        # 속생각도 max_tokens 에 들어간다. 적지 않으면 모델 기본을 따른다.
timeout = 300           # 초

[agent]
max_steps = 12              # 질문 하나에 도구를 부르는 최대 횟수(왕복 수)
tool_result_chars = 24000   # 도구 결과 하나를 모델에 넘길 때의 최대 글자 수
max_images = 4              # 도구가 돌려준 그림을 한 번에 몇 장까지 모델에 보일지

# 붙일 MCP 서버들. 이름은 로그와 안내문에 쓰인다.
[[mcp]]
name = "bizinfo"
url = "http://127.0.0.1:8765/mcp"

[[mcp]]
name = "linkreader"
url = "http://127.0.0.1:8766/mcp"

[[mcp]]
name = "history"
url = "http://127.0.0.1:8767/mcp"

[[mcp]]
name = "ntis"
url = "http://127.0.0.1:8768/mcp"

[web]
host = "127.0.0.1"          # 밖에서 직접 붙지 못하게 이 장비 안에서만 연다(외부 공개는 터널을 거친다)
port = 8080
session_hours = 12          # 이만큼 쓰지 않으면 다시 로그인
max_concurrent = 2          # 동시에 처리하는 질문 수
max_question_chars = 4000
trust_forwarded = false     # Cloudflare 터널 뒤에 둘 때만 true (접속 IP 를 CF-Connecting-IP 에서 읽는다)
allowed_hosts = ["127.0.0.1", "localhost"]   # 이 이름으로 온 요청만 받는다. 외부 공개 시 공개 도메인을 더한다

# https 로 열기. 내부망에 직접 열 때(host = "0.0.0.0")는 켜는 것을 권한다. 인증서는  python -m chat.tlscert  로 만든다.
# 상대 경로는 이 파일이 있는 폴더 기준이다. Cloudflare 터널 뒤에서는 터널이 https 를 맡으므로 없어도 된다.
# tls_cert = "certs/cert.pem"
# tls_key = "certs/key.pem"

# 로그인 계정. 계정이 하나도 없으면 웹 서버는 뜨지 않는다.
# 비밀번호 해시는  python -m chat.passwd  로 만들어 붙여 넣는다.
# [[users]]
# name = "이름"
# password_hash = "scrypt$..."

# 첨부한 한글 문서(HWP·HWPX)를 고치는 엔진 rhwp(https://github.com/edwardkim/rhwp)의 실행 파일.
# 비워 두면 PATH 에서 rhwp 를 찾고, 없으면 한글 문서는 읽기만 된다(워드 문서는 엔진 없이 고친다).
# [documents]
# rhwp = "/opt/rhwp/rhwp"
