<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;D 검색</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
<aside id="side">
  <div class="side-top">
    <strong>R&amp;D 검색</strong>
    <button id="new" type="button">새 대화</button>
  </div>
  <nav id="list" aria-label="대화 목록"></nav>
  <div class="side-bottom">
    <ul id="servers" aria-label="자료 서버 상태"></ul>
    <form method="post" action="/logout"><span id="who"></span><button type="submit" class="link">로그아웃</button></form>
  </div>
</aside>
<main>
  <header><button id="menu" type="button" aria-label="대화 목록 열기">☰</button><span id="title">새 대화</span></header>
  <section id="log" aria-live="polite">
    <div id="empty">
      <h1>무엇을 찾아 드릴까요?</h1>
      <p>지원사업 공고와 국가R&amp;D 과제를 직접 찾아 답합니다.</p>
      <ul id="examples">
        <li><button type="button">강원도 중소기업이 지금 신청할 수 있는 AI 관련 지원사업을 알려줘</button></li>
        <li><button type="button">최근 3년 기술 분야 지원사업 공고 수를 연도별·부처별로 정리해줘</button></li>
        <li><button type="button">인공지능 반도체 국가R&amp;D 과제가 연도별로 몇 건인지, 주요 수행기관은 어디인지 알려줘</button></li>
      </ul>
    </div>
  </section>
  <form id="ask">
    <textarea id="input" rows="1" placeholder="질문을 입력하세요" aria-label="질문" required></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
  <p class="hint">모델이 자료를 찾아 정리한 답입니다. 중요한 내용은 원문에서 확인하세요.</p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
