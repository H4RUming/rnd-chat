<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · R&amp;D 검색</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/login.css">
</head>
<body class="login">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M7 20V4.500h6.500a4 4 0 0 1 0 8H7M12.500 12.500 17.500 20"/><circle class="logo-node" cx="7" cy="20" r="2.300"/><circle class="logo-spark" cx="17.500" cy="20" r="2.700"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M9.9 6A9 9 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.8 3.5M14.8 14.9A4 4 0 0 1 9.1 9.2M6.3 7.8A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 3.2-.6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>
<canvas id="field" aria-hidden="true"></canvas>
<div id="progress" class="progress" role="progressbar" aria-label="신청을 보내는 중" hidden></div>

<header class="top">
  <button id="theme" class="quiet" type="button" aria-label="화면 밝기 바꾸기" title="화면 밝기 바꾸기"><svg><use id="themeicon" href="#i-monitor"/></svg></button>
</header>

<main class="gate">
  <form id="signup" class="pane" autocomplete="on" novalidate>
    <svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>
    <h1 class="sr-only">회원가입</h1>
    <div class="field">
      <input id="username" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" aria-describedby="usernamehelp" required autofocus>
      <label for="username">아이디</label>
    </div>
    <p id="usernamehelp" class="help" hidden></p>

    <div class="field">
      <input id="email" name="email" type="email" placeholder=" " autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="120" aria-describedby="emailhelp" required>
      <label for="email">이메일</label>
    </div>
    <p id="emailhelp" class="help" hidden></p>

    <div class="field">
      <input id="password" name="password" type="password" placeholder=" " autocomplete="new-password" maxlength="256" aria-describedby="passwordhelp" required>
      <label for="password">비밀번호</label>
      <button id="reveal" class="reveal" type="button" aria-label="비밀번호 보기" aria-pressed="false" title="비밀번호 보기"><svg><use id="revealicon" href="#i-eye"/></svg></button>
    </div>
    <p id="passwordhelp" class="help" hidden></p>
    <p id="formhelp" class="alert" role="alert" hidden></p>

    <p class="review">바로 가입되지 않습니다.<br>관리자가 검토한 뒤 계정이 등록됩니다.</p>
    <button id="go" class="go" type="submit"><span class="spinner" aria-hidden="true"></span><span id="golabel">가입 신청</span></button>
    <a class="alt" href="/login">로그인</a>
  </form>

  <section id="done" class="pane done" hidden>
    <span class="done-mark" aria-hidden="true"><svg><use href="#i-check"/></svg></span>
    <h2>신청을 받았습니다</h2>
    <p>관리자가 검토한 뒤 계정이 등록됩니다.</p>
    <a class="go" href="/login">로그인 화면으로</a>
  </section>
</main>

<script src="/static/backdrop.js"></script>
<script src="/static/signup.js"></script>
</body>
</html>
